<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f3ee;font-family:Helvetica,Arial,sans-serif;color:#14202e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fffdfa;border:1px solid #ddd6ca;border-radius:20px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:20px;font-weight:700;color:#1c3d70;">Swathbook</p>
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.2;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#475466;">
                  Someone (hopefully you) asked to reset the password for this account.
                </p>
                <p style="margin:0 0 28px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset_password"
                     style="display:inline-block;background:#1c3d70;color:#f6f3ee;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:999px;">
                    Choose a new password
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#566273;">
                  This link works once and expires in an hour. If you didn't ask for this, you can ignore this email and your password won't change.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
